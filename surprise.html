<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Birthday Surprise</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #2a1742, #080914 65%);
  color: #f5f4ff;
  font: 17px/1.7 system-ui, sans-serif;
}

.wrap {
  max-width: 850px;
  margin: auto;
  padding: 40px 18px;
}

.card {
  background: #15172bdd;
  border: 1px solid #555078;
  border-radius: 22px;
  padding: clamp(20px, 5vw, 42px);
  margin: 18px 0;
}

h1 {
  font-size: clamp(32px, 7vw, 58px);
  line-height: 1.1;
}

h2 {
  color: #ff9ed8;
}

p {
  white-space: pre-wrap;
}

.hero {
  text-align: center;
  padding: 35px 0;
}

button {
  padding: 12px 20px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(120deg, #ff83c8, #a78bfa);
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .65;
  cursor: default;
}

input {
  font: inherit;
}

img {
  width: 100%;
  max-height: 520px;
  object-fit: contain;
  border-radius: 14px;
  margin-top: 10px;
}

.hidden {
  display: none !important;
}

.muted {
  color: #aaaac7;
}

#challengeMsg {
  font-weight: 600;
}

.success {
  color: #86efac;
}

.warning {
  color: #fda4af;
}
</style>
</head>

<body>
<main class="wrap">

  <div id="loading" class="hero">
    <h1>✨ A little surprise is on its way…</h1>
    <p class="muted">Opening your birthday gift</p>
  </div>

  <div id="app" class="hidden">

    <header class="hero">
      <p>✦ A LITTLE SURPRISE FOR YOU ✦</p>
      <h1 id="opening"></h1>
      <button id="unlock">Unlock your surprise</button>
    </header>

    <section class="card hidden" id="main">

      <h2 id="reveal"></h2>
      <p id="wish"></p>

      <div id="memories"></div>

      <h2>🎁 One little challenge</h2>
      <p id="question"></p>

      <input
        id="answer"
        placeholder="Your answer"
        aria-label="Your challenge answer"
        autocomplete="off"
        style="padding:12px;border-radius:10px;width:100%;margin-bottom:12px"
      >

      <button id="check">Unlock next</button>

      <p id="challengeMsg" aria-live="polite"></p>

      <div id="ending" class="hidden">
        <h2>🕯️ Make a wish</h2>
        <p id="candle"></p>

        <h2>💌 A letter for you</h2>
        <p id="letter"></p>
      </div>

    </section>
  </div>
</main>

<script type="module">
import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const URL = 'https://xvfxoxllsqcrfznxiudu.supabase.co';
const KEY = 'sb_publishable_3WgnEFrtZLElVggSe_QqMg_TwethHbG';

const $ = id => document.getElementById(id);

function put(id, value) {
  $(id).textContent = value || '';
}

async function start() {
  try {
    if (KEY.includes('PASTE_')) {
      throw Error('This surprise site is not configured yet.');
    }

    const token = new URLSearchParams(location.search).get('token');

    if (!token) {
      throw Error('This birthday link is incomplete.');
    }

    const sb = createClient(URL, KEY);

    const { data, error } = await sb.rpc(
      'get_published_birthday_surprise',
      { p_token: token }
    );

    if (error) throw error;

    if (!data) {
      throw Error('This surprise link is not available.');
    }

    const d = data;

    put('opening',
      d.opening || `A small surprise for ${d.recipient || 'you'}…`);

    put('reveal',
      d.revealTitle || `Today is all about ${d.recipient || 'you'}!`);

    put('wish', d.birthdayWish);
    put('question', d.challengeQuestion);
    put('candle', d.candleMessage);
    put('letter', d.secretLetter);

    // Display the uploaded memory photos.
    const memories = $('memories');

    for (const [label, caption, photo] of [
      ['memory-1', d.memoryCaption1, d.photos?.['memory-1']],
      ['memory-2', d.memoryCaption2, d.photos?.['memory-2']]
    ]) {
      if (photo) {
        const box = document.createElement('div');
        const p = document.createElement('p');
        const img = document.createElement('img');

        p.textContent = caption || '';
        img.src = photo;
        img.alt = caption || 'Birthday memory';

        box.append(p, img);
        memories.append(box);
      }
    }

    // Display timeline photos, when present.
    for (let i = 1; i <= 10; i++) {
      const key = `timeline-${String(i).padStart(2, '0')}`;
      const photo = d.photos?.[key];

      if (photo) {
        const box = document.createElement('div');
        const p = document.createElement('p');
        const img = document.createElement('img');

        p.textContent = d[`timelineCaption${i}`] || '';
        img.src = photo;
        img.alt = p.textContent || 'Timeline memory';

        box.append(p, img);
        memories.append(box);
      }
    }

    $('loading').classList.add('hidden');
    $('app').classList.remove('hidden');

    $('unlock').onclick = () => {
      $('main').classList.remove('hidden');
      $('main').scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });
    };

    // Three-attempt challenge.
    let attempts = 0;
    let completed = false;

    const expected = String(d.challengeAnswer || '')
      .trim()
      .toLowerCase();

    $('check').onclick = () => {
      if (completed) return;

      const answer = $('answer').value.trim().toLowerCase();
      const message = $('challengeMsg');

      // Correct answer: show success and unlock immediately.
      if (expected && answer && answer === expected) {
        completed = true;

        message.textContent =
          '🎉 Correct! You know our memories so well! 💖✨';

        message.className = 'success';

        $('ending').classList.remove('hidden');
        $('check').disabled = true;

        $('ending').scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });

        return;
      }

      // Count each incorrect guess.
      attempts++;

      if (attempts >= 3) {
        completed = true;

        message.textContent =
          '💗 Three attempts completed! Your surprise is unlocked! 🎁';

        message.className = 'success';

        $('ending').classList.remove('hidden');
        $('check').disabled = true;

        $('ending').scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });

      } else {
        const remaining = 3 - attempts;

        message.textContent =
          `Not quite! Try again 💕 ${remaining} attempt(s) left.`;

        message.className = 'warning';
      }
    };

    // Allow Enter to submit a guess.
    $('answer').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        $('check').click();
      }
    });

  } catch (e) {
    $('loading').replaceChildren();

    const title = document.createElement('h1');
    const message = document.createElement('p');

    title.textContent = '💫 Surprise unavailable';
    message.textContent = String(e.message || e);

    $('loading').append(title, message);
  }
}

start();
</script>
</body>
</html>
