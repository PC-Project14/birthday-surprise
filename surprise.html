<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Birthday Surprise</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#2a1742,#080914 65%);color:#f5f4ff;font:17px/1.7 system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:40px 18px}.card{background:#15172bdd;border:1px solid #555078;border-radius:22px;padding:clamp(20px,5vw,42px);margin:18px 0}h1{font-size:clamp(32px,7vw,58px);line-height:1.1}h2{color:#ff9ed8}p{white-space:pre-wrap}.hero{text-align:center;padding:35px 0}button{padding:12px 20px;border:0;border-radius:999px;background:linear-gradient(120deg,#ff83c8,#a78bfa);font-weight:700;cursor:pointer}img{width:100%;max-height:520px;object-fit:contain;border-radius:14px;margin-top:10px}.hidden{display:none}.muted{color:#aaaac7}</style></head><body><main class="wrap"><div id="loading" class="hero"><h1>✨ A little surprise is on its way…</h1><p class="muted">Opening your birthday gift</p></div><div id="app" class="hidden"><header class="hero"><p>✦ A LITTLE SURPRISE FOR YOU ✦</p><h1 id="opening"></h1><button id="unlock">Unlock your surprise</button></header><section class="card hidden" id="main"><h2 id="reveal"></h2><p id="wish"></p><div id="memories"></div><h2>🎁 One little challenge</h2><p id="question"></p><input id="answer" placeholder="Your answer" style="padding:12px;border-radius:10px;width:100%"><button id="check">Unlock next</button><p id="challengeMsg"></p><div id="ending" class="hidden"><h2>🕯️ Make a wish</h2><p id="candle"></p><h2>💌 A letter for you</h2><p id="letter"></p></div></section></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://xvfxoxllsqcrfznxiudu.supabase.co';const KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';const $=id=>document.getElementById(id);function put(id,v){$(id).textContent=v||''}async function start(){try{if(KEY.includes('PASTE_'))throw Error('This surprise site is not configured yet.');const token=new URLSearchParams(location.search).get('token');if(!token)throw Error('This birthday link is incomplete.');const sb=createClient(URL,KEY);const{data,error}=await sb.rpc('get_published_birthday_surprise',{p_token:token});if(error)throw error;if(!data)throw Error('This surprise link is not available.');const d=data;put('opening',d.opening||`A small surprise for ${d.recipient||'you'}…`);put('reveal',d.revealTitle||`Today is all about ${d.recipient||'you'}!`);put('wish',d.birthdayWish);put('question',d.challengeQuestion);put('candle',d.candleMessage);put('letter',d.secretLetter);const m=$('memories');for(const [label,caption,photo]of [['memory-1',d.memoryCaption1,d.photos?.['memory-1']],['memory-2',d.memoryCaption2,d.photos?.['memory-2']]]){if(photo){const box=document.createElement('div');const p=document.createElement('p');p.textContent=caption||'';const img=document.createElement('img');img.src=photo;img.alt=caption||'Birthday memory';box.append(p,img);m.append(box)}}for(let i=1;i<=10;i++){const photo=d.photos?.[`timeline-${String(i).padStart(2,'0')}`];if(photo){const box=document.createElement('div');const p=document.createElement('p');p.textContent=d[`timelineCaption${i}`]||'';const img=document.createElement('img');img.src=photo;img.alt=p.textContent||'Timeline memory';box.append(p,img);m.append(box)}}$('loading').classList.add('hidden');$('app').classList.remove('hidden');$('unlock').onclick=()=>{$('main').classList.remove('hidden');$('main').scrollIntoView({behavior:'smooth'})};$('check').onclick=()=>{const answer=$('answer').value.trim().toLowerCase();if(answer&&answer===String(d.challengeAnswer||'').trim().toLowerCase()){$('challengeMsg').textContent='You got it! 💖';$('ending').classList.remove('hidden')}else $('challengeMsg').textContent='Try again — you can do it!'}}catch(e){$('loading').innerHTML='<h1>💫 Surprise unavailable</h1><p>'+String(e.message||e)+'</p>'}}start();</script></body></html>
