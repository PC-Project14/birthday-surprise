<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Studio — Admin</title><style>:root{color-scheme:dark;--bg:#080914;--panel:#15172b;--line:#353552;--text:#f5f4ff;--muted:#aaaac7;--pink:#ff83c8;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#21163b,var(--bg) 55%);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 16px 60px}h1{font-size:clamp(28px,5vw,42px)}.panel,.order{background:#15172be8;border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}input,button{font:inherit;border-radius:10px;padding:11px 13px;border:1px solid var(--line);background:#0d0f20;color:var(--text);width:100%;margin:5px 0}button{cursor:pointer;background:linear-gradient(120deg,#ff83c8,#a78bfa);color:#181027;font-weight:700;border:0}.secondary{background:#22243d;color:var(--text)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.muted{color:var(--muted)}.status{white-space:pre-wrap;color:#a7f3d0}.order h3{margin-top:0}.order pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b0c19;padding:12px;border-radius:10px}.hidden{display:none}a{color:#85e7ff;overflow-wrap:anywhere}</style></head><body><main class="wrap"><p class="muted">PRIVATE OWNER AREA</p><h1>Birthday Surprise Studio</h1><p class="muted">Review submitted customer orders, then publish a personalized surprise link.</p><section class="panel" id="login"><h2>Admin sign in</h2><div class="row"><input id="url" value="https://xvfxoxllsqcrfznxiudu.supabase.co" aria-label="Supabase URL"><input id="key" type="password" placeholder="sb_publishable_3WgnEFrtZLElVggSe_QqMg_TwethHbG" aria-label="Publishable key"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"></div><button id="signin">Sign in</button><p class="muted">Create the admin account in Supabase Authentication first. Only the email you authorize in the SQL setup should be able to read orders.</p></section><section class="panel hidden" id="dashboard"><div class="row"><button id="refresh">Refresh orders</button><button class="secondary" id="signout">Sign out</button></div><p class="status" id="status"></p><div id="orders"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';let sb=null;const $=id=>document.getElementById(id);const status=m=>$('status').textContent=m;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pretty(o){return JSON.stringify(o,null,2)}$('signin').onclick=async()=>{try{sb=createClient($('url').value.trim(),$('key').value.trim());const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');status('Signed in as '+data.user.email);await load()}catch(e){alert(e.message)}};$('signout').onclick=async()=>{await sb?.auth.signOut();location.reload()};$('refresh').onclick=load;async function load(){status('Loading orders…');const{data,error}=await sb.from('birthday_orders').select('*').order('created_at',{ascending:false});if(error){status(error.message);return}status(`${data.length} order(s) found.`);$('orders').innerHTML=data.map(o=>`<article class="order"><h3>${esc(o.recipient)} — from ${esc(o.sender)}</h3><p class="muted">${esc(o.created_at)} · ${esc(o.status)} · ${esc(o.id)}</p><details><summary>View submitted details</summary><pre>${esc(pretty(o.content))}</pre><pre>Photo paths:
${esc(pretty(o.photo_paths))}</pre></details><button data-id="${esc(o.id)}" class="publish">Publish final surprise link</button><p class="link" id="link-${esc(o.id)}"></p></article>`).join('')||'<p>No customer orders yet.</p>';document.querySelectorAll('.publish').forEach(b=>b.onclick=()=>publish(b.dataset.id))}async function publish(id){try{status('Preparing secure photo links…');const{data:o,error}=await sb.from('birthday_orders').select('*').eq('id',id).single();if(error)throw error;const content={...o.content,photos:{}};for(const[label,path]of Object.entries(o.photo_paths||{})){const{data,error}=await sb.storage.from('birthday-photos').createSignedUrl(path,60*60*24*365);if(error)throw error;content.photos[label]=data.signedUrl}const token=crypto.randomUUID()+crypto.randomUUID().replaceAll('-','');const{error:upErr}=await sb.from('birthday_orders').update({status:'published',share_token:token,published_content:content}).eq('id',id);if(upErr)throw upErr;const link=new URL('surprise.html',location.href);link.searchParams.set('token',token);const node=$('link-'+id);node.innerHTML=`Final link: <a href="${esc(link.href)}" target="_blank" rel="noopener">${esc(link.href)}</a><button class="secondary copy">Copy link</button>`;node.querySelector('.copy').onclick=async()=>{await navigator.clipboard.writeText(link.href);status('Link copied. Send it to the customer.')} ;status('Published. Copy and send the link to the customer.')}catch(e){status('Publish failed: '+e.message)}};</script></body></html>
